services:
  - type: web
    name: roti-chatbot-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FAMILY_USERNAME
        value: family
      - key: FAMILY_PASSWORD
        sync: false
